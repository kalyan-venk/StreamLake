name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, unit tests, contract specs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Spark 4 supports JDK 17 and 21. Pinning it here is not boilerplate: the local failure
      # mode for the wrong JDK is an obscure reflection error, not a clear message.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python 3.12 .venv
          VIRTUAL_ENV=.venv uv pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check src tests

      - name: Unit tests
        env:
          TZ: UTC
          PYTHONPATH: src
        run: .venv/bin/pytest -q

      # The contracts are the interface the whole pipeline is written against; a typo in one is
      # a runtime failure three hops deep, so it gets caught here instead.
      - name: Contract specs load
        env:
          PYTHONPATH: src
        run: .venv/bin/python -m streamlake contracts

  batch-e2e:
    name: batch pipeline + dbt build, against a real sample
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python 3.12 .venv
          VIRTUAL_ENV=.venv uv pip install -e ".[dev]"

      # Iceberg's runtime jar is resolved from Maven on first use and lives outside the uv cache
      # above; caching it here means only the first run on a given jar version pays for it.
      - name: Cache Ivy (Iceberg jar resolution)
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy2-${{ runner.os }}-iceberg-spark-runtime-4.0_2.13-1.11.0

      # Runs bronze -> silver -> gold -> export -> warehouse-load against the small, deterministic
      # sample in tests/fixtures/ci_sample/ (see scripts/make_ci_sample.py), not the real ~506 MB
      # download: nobody has ever watched this run in CI, so every number in the README has been
      # hand-verified only. This is what makes a broken pipeline actually turn CI red, including
      # the write-audit-publish path in batch/silver.py: the contracts it runs are real, against
      # real data, not `dbt parse`'s syntax check or a mocked contract report.
      - name: Run the batch pipeline against the CI sample
        env:
          TZ: UTC
          PYTHONPATH: src
          RAW_DIR: tests/fixtures/ci_sample
          CONTRACTS_DIR: conf/contracts-ci
        run: |
          .venv/bin/python -m streamlake bronze
          .venv/bin/python -m streamlake silver
          .venv/bin/python -m streamlake gold
          .venv/bin/python -m streamlake export
          .venv/bin/python -m streamlake warehouse-load
          .venv/bin/python -m streamlake summary

      # Runs every model and every data test against the DuckDB the step above just loaded, not
      # just a syntax check against an empty schema.
      - name: dbt build
        run: |
          .venv/bin/dbt build \
            --project-dir dbt/streamlake --profiles-dir dbt/streamlake

  infra:
    name: terraform + manifests validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.9.0"

      - name: Terraform format and validate
        working-directory: infra/terraform
        run: |
          tofu fmt -check -diff
          tofu init -backend=false -input=false
          tofu validate

      - name: Kustomize build
        run: kubectl kustomize infra/k8s > /dev/null

  infra-localstack:
    name: lakehouse storage terraform plan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.9.0"

      # The provider skip_* flags plus static test credentials let plan compute a full create
      # plan with no LocalStack container running, so this job is deterministic and green offline.
      - name: Terraform format, validate, plan
        working-directory: infra/terraform-localstack
        run: |
          tofu fmt -check -diff
          tofu init -input=false
          tofu validate
          tofu plan -input=false -lock=false

  docker:
    name: consumer image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only, the image bakes in the Spark runtime jars, so this also verifies that the
      # pinned jar versions still exist on Maven Central.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.stream
          push: false
          tags: streamlake/stream:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

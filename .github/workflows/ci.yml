name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, unit tests, contract specs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Spark 4 supports JDK 17 and 21. Pinning it here is not boilerplate: the local failure
      # mode for the wrong JDK is an obscure reflection error, not a clear message.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python 3.12 .venv
          VIRTUAL_ENV=.venv uv pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check src tests

      - name: Unit tests
        env:
          TZ: UTC
          PYTHONPATH: src
        run: .venv/bin/pytest -q

      # Parses every model, test and macro against the real adapter without touching data.
      - name: dbt parse
        run: |
          .venv/bin/dbt parse \
            --project-dir dbt/streamlake --profiles-dir dbt/streamlake

      # The contracts are the interface the whole pipeline is written against; a typo in one is
      # a runtime failure three hops deep, so it gets caught here instead.
      - name: Contract specs load
        env:
          PYTHONPATH: src
        run: .venv/bin/python -m streamlake contracts

  infra:
    name: terraform + manifests validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.9.0"

      - name: Terraform format and validate
        working-directory: infra/terraform
        run: |
          tofu fmt -check -diff
          tofu init -backend=false -input=false
          tofu validate

      - name: Kustomize build
        run: kubectl kustomize infra/k8s > /dev/null

  docker:
    name: consumer image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — the image bakes in the Spark runtime jars, so this also verifies that the
      # pinned jar versions still exist on Maven Central.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.stream
          push: false
          tags: streamlake/stream:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

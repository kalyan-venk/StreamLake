name: streamlake
version: "1.0.0"
config-version: 2
profile: streamlake

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Schema the lakehouse export lands in. Overridden per warehouse in CI.
  raw_schema: streamlake_raw
  # The month the current run covers; the freshness mart measures against its end.
  period_end: "2024-02-01"

models:
  streamlake:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

name: streamlake
version: "1.0.0"
config-version: 2
profile: streamlake

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # DuckDB default schema for the lakehouse export. On the snowflake target the
  # loader writes to SNOWFLAKE_SCHEMA (RAW); _sources.yml scopes the raw schema by
  # target and reads SNOWFLAKE_SCHEMA there, so this default only applies to DuckDB.
  # (dbt does not render jinja in dbt_project.yml var values, so the branch lives
  # in _sources.yml where jinja is evaluated, not here.)
  raw_schema: streamlake_raw
  # The end of the period the loaded Sparkov data covers (verified: train+test span
  # 2019-01-01 through 2020-12-31); the freshness mart measures against this.
  period_end: "2021-01-01"

models:
  streamlake:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

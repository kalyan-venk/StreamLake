version: 2

sources:
  - name: lakehouse
    description: >
      Tables the lakehouse exported into the warehouse. These are loaded by
      `streamlake warehouse-load`, which reconciles row counts against the export manifest, so
      dbt can treat them as trustworthy inputs, the contract engine has already run on the
      Iceberg tables they came from.
    # Source schema is scoped by target so sourcing .env.local (Snowflake secrets)
    # never poisons the local DuckDB path. On Snowflake the loader writes to
    # SNOWFLAKE_SCHEMA (RAW), so align to it. On DuckDB use var('raw_schema')
    # (streamlake_raw), regardless of what env vars happen to be set. Kept here,
    # not in dbt_project.yml, because dbt renders jinja in this file but not in
    # dbt_project.yml var values.
    schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'RAW') if target.name == 'snowflake' else var('raw_schema') }}"
    tables:
      - name: transactions
        description: One row per card transaction, post-quarantine, post-dedup, PII-masked (silver).
        columns:
          - name: trans_num
            description: Sparkov's natural event id, stable across batch and stream.
            data_tests: [unique, not_null]
          - name: trans_time
            data_tests: [not_null]
          - name: amt
            data_tests: [not_null]
          - name: cc_num_hash
            description: Salted hash of the card number; the raw PAN never reaches this layer.
            data_tests: [not_null]

      - name: dim_category
        description: Sparkov merchant-category reference, conformed, with an online/in-person/general channel.
        columns:
          - name: category
            data_tests: [unique, not_null]

      - name: category_hourly_fraud
        description: >
          Spark's own fraud-rate-by-category-by-hour aggregation. dbt rebuilds the same numbers
          independently in fct_category_hourly_fraud; the two are compared by
          tests/assert_batch_spark_dbt_parity.sql.

      - name: state_hourly_volume
        description: Spark's hourly cardholder-state volume aggregation.

      - name: merchant_risk_leaderboard
        description: Spark's fraud-rate-per-merchant leaderboard, gated on a minimum transaction volume.
        columns:
          - name: merchant
            data_tests: [not_null]
          - name: txns
            data_tests: [not_null, positive_values]
          - name: fraud_rate
            data_tests: [not_null, fraction_range]

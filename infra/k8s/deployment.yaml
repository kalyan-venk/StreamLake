apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlake-consumer
  namespace: streamlake
  labels:
    app.kubernetes.io/name: streamlake
    app.kubernetes.io/component: stream-consumer
spec:
  # Exactly one. Two consumers on one checkpoint directory is not "more throughput", it is a
  # lock fight; scaling the stream means more Kafka partitions and more Spark executors, not
  # more Deployment replicas.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: streamlake
      app.kubernetes.io/component: stream-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streamlake
        app.kubernetes.io/component: stream-consumer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      initContainers:
        # Wait for the broker and create the topic explicitly. Relying on Kafka's
        # auto.create.topics.enable does not work here: Spark's offset reader asks the admin API
        # for partitions before any produce request exists, gets UnknownTopicOrPartition, and the
        # query dies. Creating the topic up front is also what you want in production, where
        # partition count and retention are deliberate choices rather than broker defaults.
        - name: create-topic
          image: apache/kafka:3.9.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$KAFKA_BOOTSTRAP" --list >/dev/null 2>&1; do
                echo "waiting for broker at $KAFKA_BOOTSTRAP"; sleep 3
              done
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$KAFKA_BOOTSTRAP" \
                --create --if-not-exists --topic "$KAFKA_TOPIC" \
                --partitions 3 --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$KAFKA_BOOTSTRAP" \
                --describe --topic "$KAFKA_TOPIC"
          envFrom:
            - configMapRef:
                name: streamlake-env
      containers:
        - name: consumer
          image: streamlake/stream:local
          imagePullPolicy: IfNotPresent
          args: ["consume"]
          envFrom:
            - configMapRef:
                name: streamlake-env
          ports:
            - name: spark-ui
              containerPort: 4040
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: checkpoints
              mountPath: /data/checkpoints
            - name: warehouse
              mountPath: /data/warehouse
          # The Spark UI answering on 4040 means the driver is alive. It does not mean the
          # stream is progressing — that is what the Airflow lag check and the contract on the
          # stream table are for. A liveness probe cannot tell the difference.
          livenessProbe:
            tcpSocket:
              port: 4040
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 4
          readinessProbe:
            tcpSocket:
              port: 4040
            initialDelaySeconds: 45
            periodSeconds: 15
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: streamlake-checkpoints
        - name: warehouse
          persistentVolumeClaim:
            claimName: streamlake-warehouse

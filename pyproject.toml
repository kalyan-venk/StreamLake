[project]
name = "streamlake"
version = "0.1.0"
description = "An end-to-end streaming lakehouse with enforced data contracts"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyspark==4.0.4",
    "duckdb>=1.1",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "pandas",
    "pyarrow",
    "requests",
    "pyyaml",
    "jinja2",
    "confluent-kafka",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
snowflake = ["dbt-snowflake>=1.9", "snowflake-connector-python"]

[project.scripts]
streamlake = "streamlake.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The dashboard template is CSS and HTML held in string literals; wrapping a stylesheet at
# 100 columns makes it harder to read, not easier.
"src/streamlake/dashboard/template.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

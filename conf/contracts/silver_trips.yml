name: silver_trips
dataset: lakehouse.silver.trips
layer: silver
owner: data-platform
description: >
  The contract that matters. Everything downstream — gold, the warehouse, dbt, the dashboard —
  reads this table and is entitled to assume every assertion below holds. Rows that would break
  these rules were quarantined upstream with a reason; if a breach still reaches here, either a
  quarantine rule has a hole or the source changed shape, and the run must stop.

schema:
  # strict: an undeclared column is a failure. A new column is not free — it means someone
  # changed the transform without updating the contract the consumers read.
  strict: true
  columns:
    - name: trip_id
      type: string
      nullable: false
    - name: vendor_id
      type: int
    - name: pickup_ts
      type: timestamp
      nullable: false
    - name: dropoff_ts
      type: timestamp
      nullable: false
    - name: pickup_date
      type: date
      nullable: false
    - name: pickup_hour
      type: int
      nullable: false
    - name: passenger_count
      type: bigint
    - name: trip_distance_mi
      type: double
      nullable: false
    - name: trip_duration_min
      type: double
      nullable: false
    - name: avg_speed_mph
      type: double
    - name: ratecode_id
      type: bigint
    - name: store_and_fwd_flag
      type: string
    - name: pu_location_id
      type: int
      nullable: false
    - name: do_location_id
      type: int
      nullable: false
    - name: pickup_borough
      type: string
      nullable: false
    - name: pickup_zone
      type: string
      nullable: false
    - name: pickup_service_zone
      type: string
    - name: dropoff_borough
      type: string
      nullable: false
    - name: dropoff_zone
      type: string
      nullable: false
    - name: dropoff_service_zone
      type: string
    - name: payment_type
      type: bigint
    - name: payment_type_desc
      type: string
      nullable: false
    - name: fare_amount
      type: double
      nullable: false
    - name: extra
      type: double
    - name: mta_tax
      type: double
    - name: tip_amount
      type: double
    - name: tip_pct
      type: double
    - name: tolls_amount
      type: double
    - name: improvement_surcharge
      type: double
    - name: congestion_surcharge
      type: double
    - name: airport_fee
      type: double
    - name: total_amount
      type: double
      nullable: false
    - name: source_file
      type: string
      nullable: false
    - name: batch_id
      type: string
      nullable: false
    - name: ingested_at
      type: timestamp
      nullable: false

checks:
  - type: unique
    columns: [trip_id]
    description: >
      The dedup guarantee. This is the assertion that makes a re-run safe and makes the Kafka
      arm's at-least-once delivery harmless.

  - type: row_count
    min: 2000000
    max: 4000000
    description: guards against a silent partial load — a half-empty month still "succeeds" otherwise

  - type: expression
    expr: dropoff_ts > pickup_ts
    description: time does not run backwards; quarantine should have caught every violation

  - type: expression
    expr: trip_duration_min > 0 AND trip_duration_min <= 1440
    description: a trip lasts between one second and one day

  - type: expression
    expr: pickup_date = to_date(pickup_ts)
    description: the partition column must agree with the timestamp it was derived from

  - type: accepted_range
    column: trip_distance_mi
    min: 0
    max: 300
    description: a yellow cab does not drive 300 miles inside a NYC fare zone

  - type: accepted_range
    column: total_amount
    min: 0
    max: 100000
    description: >
      An absurdity bound, not a business rule. Negative totals are quarantined; this catches the
      occasional TLC row with a five-figure fare typo.

  - type: accepted_range
    column: avg_speed_mph
    min: 0
    max: 150
    severity: warn
    description: >
      Deliberately a warning. A one-minute trip with a mis-recorded distance produces an
      impossible speed, and that is a data-quality signal worth surfacing — but it is not a
      reason to stop the pipeline.

  - type: accepted_values
    column: payment_type
    values: [0, 1, 2, 3, 4, 5, 6]
    description: TLC's payment_type domain, including the undocumented 0 that appears in 2024 files

  - type: null_rate
    column: passenger_count
    max: 0.10
    description: >
      Nulls here are expected (driver did not enter it) but a jump means the vendor feed changed.

  - type: freshness
    column: pickup_ts
    max_age: 3 days
    description: measured against the end of the loaded month

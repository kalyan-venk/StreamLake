name: bronze_trips
dataset: lakehouse.bronze.trips_raw
layer: bronze
owner: data-platform
description: >
  The landing contract. Bronze is a faithful copy of what NYC TLC published, so this contract
  asserts almost nothing about data *quality* — it asserts that we received the file we expected:
  the right columns, the right types, a plausible number of rows, and timestamps that actually
  cover the month we asked for. If this fails, the problem is upstream, not in our code.

schema:
  strict: false
  columns:
    - name: trip_id
      type: string
      nullable: false
      description: SHA-256 surrogate key minted at ingestion
    - name: VendorID
      type: int
    - name: tpep_pickup_datetime
      type: timestamp_ntz
      description: TLC publishes wall-clock time with no zone; silver normalises it
    - name: tpep_dropoff_datetime
      type: timestamp_ntz
    - name: passenger_count
      type: bigint
    - name: trip_distance
      type: double
    - name: PULocationID
      type: int
    - name: DOLocationID
      type: int
    - name: payment_type
      type: bigint
    - name: fare_amount
      type: double
    - name: total_amount
      type: double
    - name: source_file
      type: string
      nullable: false
    - name: batch_id
      type: string
      nullable: false
    - name: ingested_at
      type: timestamp
      nullable: false

checks:
  - type: row_count
    min: 1000000
    max: 20000000
    description: a month of yellow-taxi trips is ~3M rows; orders of magnitude off means a bad fetch

  - type: unique
    columns: [trip_id]
    severity: warn
    description: >
      TLC occasionally republishes byte-identical trips. Warn rather than fail — silver is the
      layer that guarantees one row per trip.

  - type: freshness
    column: tpep_pickup_datetime
    max_age: 3 days
    description: >
      Measured against the end of the loaded month, not wall clock. Asserts the file actually
      contains the period it claims to.

name: bronze_zones
dataset: lakehouse.bronze.zones_raw
layer: bronze
owner: data-platform
description: >
  The TLC zone lookup is a small, slow-moving reference file, which is exactly why it is worth
  a contract. A silently truncated lookup would not fail any job; it would just turn thousands
  of trips into "Unknown" zones and quietly move revenue between boroughs on the dashboard.

schema:
  strict: false
  columns:
    - name: location_id
      type: int
      nullable: false
    - name: borough
      type: string
      nullable: false
    - name: zone
      type: string
    - name: service_zone
      type: string

checks:
  - type: row_count
    min: 200
    max: 400
    description: the lookup has had 265 zones for years; a big move means the schema changed

  - type: unique
    columns: [location_id]
    description: location_id is the join key for both pickup and dropoff enrichment

  - type: accepted_values
    column: borough
    values: ["Manhattan", "Brooklyn", "Queens", "Bronx", "Staten Island", "EWR", "Unknown", "N/A"]

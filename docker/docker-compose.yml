# Local infrastructure for Layer 2. Everything here is free and disposable:
#   docker compose -f docker/docker-compose.yml up -d
#
# Kafka runs in KRaft mode, no ZooKeeper, one container. MinIO is optional and only needed if
# you want to prove the lakehouse works against real S3 object storage instead of a local path
# (see the `minio` profile and docs/RUNBOOK.md).

name: streamlake

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: streamlake-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      # Two listeners on purpose: containers reach the broker as `kafka:19092`, the Spark job on
      # the host reaches it as `localhost:9092`. Advertising only one is the classic reason a
      # producer connects and then times out on the first send.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: streamlake-local-cluster
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: streamlake-kafka-ui
    profiles: ["ui"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: streamlake
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"

  minio:
    image: minio/minio:latest
    container_name: streamlake-minio
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/streamlake &&
      echo 'bucket streamlake ready'
      "

  # LocalStack backs the Terraform module in infra/terraform-localstack: it mocks the AWS APIs
  # (S3, Glue, IAM, STS) the module provisions against. Kept on its own `localstack` profile so
  # it never starts with the default Kafka stack. Bring it up with `make localstack-up`, which
  # uses the repo-scoped compose project name `streamlake-ext` to avoid colliding with the other
  # local stacks on this machine.
  localstack:
    image: localstack/localstack:3.8
    container_name: streamlake-localstack
    profiles: ["localstack"]
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,glue,iam,sts
      DEBUG: "0"
      DOCKER_HOST: unix:///var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  minio-data:
